# Drop-in override: suppress login prompt on tty1.
# This keeps tty1 owned by our dashboard service.
# Other TTYs (tty2-tty6) are unaffected and show normal login prompts.

[Unit]
# Our dashboard conflicts with getty — tell systemd they can't share tty1
Conflicts=getty@tty1.service

[Service]
# Override: do nothing (the dashboard service owns tty1 instead)
ExecStart=
ExecStart=-/bin/true
Restart=no
